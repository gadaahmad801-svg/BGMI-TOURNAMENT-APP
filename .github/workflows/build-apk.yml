name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set."
            exit 1
          fi

          JAVA_VERSION_OUTPUT=$(java -version 2>&1 | head -n 1)
          JAVA_MAJOR=$(echo "$JAVA_VERSION_OUTPUT" | sed -E 's/.*version "([0-9]+).*/\1/')

          if ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Unable to detect Java major version from '$JAVA_VERSION_OUTPUT'."
            exit 1
          fi

          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java major version ($JAVA_MAJOR) is lower than 17."
            exit 1
          fi

          echo "Java 17 or newer confirmed successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists. Skipping generation."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore ./debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000

            if [ ! -f "./debug.keystore" ]; then
              echo "ERROR: Failed to create ./debug.keystore."
              exit 1
            fi
            echo "Temporary debug keystore created successfully."
          fi

      - name: Build the debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected debug APK not found at $EXPECTED_APK."
            echo "Searching within app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: Discovered APK file $EXPECTED_APK is empty."
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "ERROR: File $EXPECTED_APK does not have the .apk extension."
            exit 1
          fi

          echo "Verified debug APK successfully: $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR="${RUNNER_TEMP}/apk-release-asset"
          mkdir -p "$TEMP_DIR"

          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SANITIZED_REPO=$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
          if [ -z "$SANITIZED_REPO" ]; then
            SANITIZED_REPO="android-app"
          fi

          RELEASE_FILENAME="${SANITIZED_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TARGET_PATH="${TEMP_DIR}/${RELEASE_FILENAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$TARGET_PATH"

          if [ ! -f "$TARGET_PATH" ] || [ ! -s "$TARGET_PATH" ]; then
            echo "ERROR: Prepared release asset is missing or empty at $TARGET_PATH."
            exit 1
          fi

          echo "Release asset prepared: $TARGET_PATH"
          echo "asset_path=${TARGET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${RELEASE_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Verifying GitHub CLI..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset $ASSET_PATH is missing or empty. Skipping release creation."
            exit 1
          fi

          if [[ "$ASSET_PATH" != *.apk ]]; then
            echo "ERROR: Release asset $ASSET_PATH does not have .apk extension. Skipping release creation."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          cat << EOF > "$NOTES_FILE"
          ## Automated Debug APK Build

          - This is an automatically generated debug APK.
          - The APK was built by GitHub Actions.
          - The GitHub Actions run number: ${GITHUB_RUN_NUMBER}
          - The GitHub Actions run attempt: ${GITHUB_RUN_ATTEMPT}
          - The source commit SHA: ${GITHUB_SHA}
          - The APK is intended for testing.
          - The APK is not a Play Store production release.
          - The APK is signed only with a temporary debug keystore.
          EOF

          echo "Publishing release with tag $RELEASE_TAG and asset $ASSET_NAME..."
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --target "${GITHUB_SHA}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "=== Release Publishing Succeeded ==="
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq .url 2>/dev/null || echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}")
            RELEASE_TITLE=$(gh release view "$RELEASE_TAG" --json name --jq .name 2>/dev/null || echo "Debug APK Build #${GITHUB_RUN_NUMBER}")

            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🚀 Debug APK Build & Release Succeeded

          - **Release Tag:** \`${RELEASE_TAG}\`
          - **Release Title:** ${RELEASE_TITLE}
          - **Direct Release Page:** [View Release Page](${RELEASE_URL})
          - **Downloadable APK Asset:** \`${ASSET_NAME}\`

          ### How to Download:
          The debug APK is directly downloadable from the **Assets** section of the [Release Page](${RELEASE_URL}).
          
          > **Backup Artifact:** The standard GitHub Actions artifact named **\`app-debug-apk\`** is also preserved and available on this workflow run page.
          EOF

          else
            echo "WARNING: Release publishing did not succeed or was skipped."
            echo "The APK build succeeded, and the GitHub Actions artifact named 'app-debug-apk' remains available."

            cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## ⚠️ Debug APK Built - Release Warning

          - **Build Status:** Succeeded
          - **Release Publishing:** Release publishing encountered an issue or was skipped.
          - **Actions Artifact:** The APK is available as artifact **\`app-debug-apk\`** on this workflow run page.
          EOF
          fi
